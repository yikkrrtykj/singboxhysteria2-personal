name: personal-installer-tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  installer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install verification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jq shellcheck python3-yaml
      - name: Shell checks
        run: |
          bash -n install.sh
          shellcheck -S error install.sh
          shellcheck tests/test-personal.sh
      - name: Installer regression and real configuration checks
        run: bash tests/test-personal.sh
