name: personal-tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  phase-c-d:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq shellcheck
      - name: Phase C regression
        run: bash tests/test-phase-c.sh
      - name: Phase D regression
        run: bash tests/test-phase-d.sh
